          <tr>
            <td height="8" bgcolor="#7347f2" style="height:8px;line-height:8px;font-size:0;background-color:#7347f2;background-image:linear-gradient(90deg,#7347f2,#d95294);border-radius:24px 24px 0 0;">&nbsp;</td>
          </tr>

            <td style="padding:12px 28px 0;font-family:ui-rounded,'Avenir Next','Nunito','Segoe UI',sans-serif;font-size:16px;line-height:1.45;color:#c9c9d6;">
              <p style="margin:0;">Sus Out deleted the account for <span style="color:#ffffff;">{{ .Email }}</span>, including the packs and scores saved with it.</p>
            </td>
          </tr>
          <tr>
            <td style="padding:18px 28px 28px;font-family:ui-rounded,'Avenir Next','Nunito','Segoe UI',sans-serif;font-size:13px;line-height:1.45;color:#a7a7b8;">If you did this, you can ignore this email. If you did not, create a new account in Game Settings.</td>
          </tr>
