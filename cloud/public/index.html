<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#141a2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Mismatch — Pick Your Card</title>
  <style>
    body { margin: 0; min-height: 100vh; background: #141a2e; color: #fff; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    .loading { opacity: 0.85; text-align: center; padding: 48px 24px; }
    .error { color: #f87171; text-align: center; padding: 24px; }
  </style>
  <link rel="stylesheet" href="/card.css">
</head>
<body>
  <div class="room-bg" aria-hidden="true"></div>
  <div class="room-vignette" aria-hidden="true"></div>
  <main id="app" class="app-shell">
    <p class="loading">Loading game…</p>
  </main>
  <script>
    window.SESSION_TOKEN = "{{TOKEN}}";
  </script>
  <script src="/card.js" defer onerror="document.getElementById('app').innerHTML='<p class=&quot;error&quot;>Could not load game scripts. Copy the link from the host and open it in Safari.</p>';"></script>
</body>
</html>
