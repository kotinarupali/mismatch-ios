<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mismatch — Pick Your Card</title>
  <style>
    body { font-family: -apple-system, sans-serif; margin: 0; padding: 24px; background: #111; color: #fff; min-height: 100vh; }
    main { max-width: 420px; margin: 0 auto; }
    .loading { opacity: 0.85; text-align: center; padding: 24px 0; }
    .error { color: #f87171; text-align: center; }
  </style>
  <link rel="stylesheet" href="/card.css">
</head>
<body>
  <main id="app">
    <p class="loading">Loading game…</p>
  </main>
  <script>
    window.SESSION_TOKEN = "{{TOKEN}}";
  </script>
  <script src="/card.js" defer onerror="document.getElementById('app').innerHTML='<p class=&quot;error&quot;>Could not load game scripts. Copy the link from the host and open it in Safari.</p>';"></script>
</body>
</html>
